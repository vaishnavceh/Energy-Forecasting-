name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============ JOB 1: Code Quality ============
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8 (linting)
        run: |
          flake8 scripts/ tests/ --max-line-length=100 --ignore=E501,W503,E203

      - name: Check formatting with black
        run: |
          black --check --line-length=100 scripts/ tests/

      - name: Check import order with isort
        run: |
          isort --check-only --profile black scripts/ tests/

  # ============ JOB 2: Tests ============
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

      - name: Upload coverage report
        if: matrix.python-version == '3.10'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  # ============ JOB 3: Security Check ============
  security:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install safety

      - name: Check for known vulnerabilities
        run: |
          pip install -r requirements.txt
          safety check --output text || true

  # ============ JOB 4: Build Validation ============
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify scripts are importable
        run: |
          python -c "import sys; sys.path.insert(0, '.'); exec(open('scripts/preprocess_pjm.py').read().split('if __name__')[0])"
          python -c "import sys; sys.path.insert(0, '.'); exec(open('scripts/preprocess_smartmeter.py').read().split('if __name__')[0])"
          python -c "import sys; sys.path.insert(0, '.'); exec(open('scripts/compress_to_parquet.py').read().split('if __name__')[0])"
          echo "All scripts importable!"

      - name: Validate project structure
        run: |
          test -f README.md && echo "✅ README.md exists"
          test -f requirements.txt && echo "✅ requirements.txt exists"
          test -f .gitignore && echo "✅ .gitignore exists"
          test -f scripts/preprocess_pjm.py && echo "✅ preprocess_pjm.py exists"
          test -f scripts/preprocess_smartmeter.py && echo "✅ preprocess_smartmeter.py exists"
          test -f scripts/compress_to_parquet.py && echo "✅ compress_to_parquet.py exists"
          test -d tests && echo "✅ tests/ directory exists"
          echo "🎉 Project structure validated!"
